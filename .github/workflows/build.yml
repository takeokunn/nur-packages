name: "Build and populate cache"
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: 51 2 * * *
jobs:
  tests:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest # M1
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-24.11.tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Show nixpkgs version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
      - name: Check evaluation
        run: |
          nix-env -f . -qa \* --meta --xml \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs="$(nix-instantiate --find-file nixpkgs)" \
            -I "$PWD"
      - name: Build nix packages
        run: nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs

  # Packages built via an upstream flake rather than a plain nixpkgs derivation (arto, aitools) are
  # threaded into default.nix from flake.nix's legacyPackages rather than through ci.nix's
  # `import ./default.nix { inherit pkgs; }` (no flake context there, so they evaluate to null and
  # ci.nix's isDerivation filter silently drops them). The `tests` job above never builds them.
  #
  # arto is deliberately not built here yet: pkgs/arto/default.nix pins pnpm_9, which nixpkgs has
  # since removed as EOL, so it fails independently of this job's own wiring. Tracked separately
  # rather than fixed here, since a pnpm version bump needs a new fetchPnpmDeps hash and this job
  # exists to cover aitools.
  flake-packages:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build aitools
        run: nix build .#aitools --no-link --print-out-paths
